<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas do Nutricionista</title>
</head>
<body>
    <center>
        <h1>Novo Pedido</h1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identidade" name="id" required><br><br>
            <input type="text" placeholder="Paciente" name="paciente" required><br><br>
            <input type="number" placeholder="Peso em KG" name="peso" step="0.1" required><br><br>
            <input type="number" placeholder="Altura em Metros" name="altura" required><br><br>
            <input type="date" placeholder="Data" name="data" required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
